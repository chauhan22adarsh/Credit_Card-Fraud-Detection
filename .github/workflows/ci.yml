name: CI Checks

on:
  push:
    branches: [ main ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:
    
      - name: Get my code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run the real training pipeline
        run: |
          python -m src.components.data_ingestion

      - name: Check the model artifacts were actually created
        run: |
          test -f artifacts/model.pkl && echo "model.pkl exists"
          test -f artifacts/preprocessor.pkl && echo "preprocessor.pkl exists"

      - name: Check the Flask app loads with the trained model
        run: |
          python -c "import application"
