name: CI Checks

on:
  push:
    branches: [ main ]

jobs:
  check-code:
    runs-on: ubuntu-latest

    steps:

      - name: Get my code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install -r requirements-prod.txt

      - name: Check the app actually imports (no syntax errors)
        run: |
          python -c "import application"
